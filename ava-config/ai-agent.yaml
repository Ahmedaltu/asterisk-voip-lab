default_provider: local
active_pipeline: local_only

audio_transport: audiosocket
audiosocket:
  host: "0.0.0.0"
  port: 8090
  advertise_host: "ai_engine"
  format: ulaw

ari:
  host: "asterisk"
  port: 8088
  username: "ava"
  password: "ava-secret"
  app_name: "ava"

pipelines:
  local_only:
    stt: local_stt
    llm: local_llm
    tts: local_tts
    options:
      stt:
        chunk_ms: 320
        streaming: true
        stream_format: pcm16_16k
        mode: stt
      llm:
        temperature: 0.7
        max_tokens: 64
      tts:
        format:
          encoding: ulaw
          sample_rate: 8000

providers:
  local:
    enabled: true
    ws_url: "ws://local_ai_server:8765"
    auth_token: "voiplab-secret-token"
    connect_timeout_sec: 5.0
    response_timeout_sec: 15.0
    chunk_ms: 320

  local_stt:
    type: local
    enabled: true
    capabilities: [stt]
    ws_url: "ws://local_ai_server:8765"
    auth_token: "voiplab-secret-token"

  local_llm:
    type: local
    enabled: true
    capabilities: [llm]
    ws_url: "ws://local_ai_server:8765"
    auth_token: "voiplab-secret-token"

  local_tts:
    type: local
    enabled: true
    capabilities: [tts]
    ws_url: "ws://local_ai_server:8765"
    auth_token: "voiplab-secret-token"

contexts:
  default:
    provider: local
    greeting: |
      Hello! I'm your AI assistant. How can I help you today?
    prompt: |
      You are a helpful voice assistant. Keep responses under 2 sentences.

llm:
  initial_greeting: "Hello, how can I help you today?"
  prompt: "You are a concise and helpful voice assistant. Keep replies short."
